buildscript {
  ext.FileViewerTurbo = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return FileViewerTurbo[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"

// AGP 9+ ships built-in Kotlin support and registers the `kotlin` extension itself.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

// Accepts 36, "36" and "android-36" from the root project.
def getExtOrIntegerDefault(prop) {
  def value = getExtOrDefault(prop)
  return (value instanceof CharSequence ? value.toString() - ~/^android-/ : value).toInteger()
}

android {
  namespace = "com.fileviewerturbo"

  compileSdk = getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk = getExtOrIntegerDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
